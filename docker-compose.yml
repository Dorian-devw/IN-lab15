services:
  hadoop-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: hadoop-ubuntu:3.3.6
    container_name: hadoop-master
    hostname: laptop
    ports:
      - "9870:9870"   # HDFS NameNode Web UI
      - "9864:9864"   # HDFS DataNode Web UI
      - "8088:8088"   # YARN ResourceManager Web UI
      - "8042:8042"   # YARN NodeManager Web UI
      - "9000:9000"   # HDFS IPC NameNode
      - "19888:19888" # MapReduce JobHistory Server
    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/hadoop-env.sh:/opt/hadoop/etc/hadoop/hadoop-env.sh:ro
      - ./dataset:/home/ubuntu/dataset
      - ./mapreduce:/home/ubuntu/mapreduce
      - ./run_pipeline.sh:/home/ubuntu/run_pipeline.sh
    restart: unless-stopped
